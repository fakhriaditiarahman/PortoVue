# Renders your cards every day and keeps README.md up to date between the
# <!-- profilescape:start --> and <!-- profilescape:end --> markers.
# Edit this setup in the playground: https://chethandvg.github.io/profilescape/#playground?cards=3d

name: Profilescape

on:
  schedule:
    - cron: "23 4 * * *" # every day at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profilescape
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: chethandvg/profilescape@v1
        with:
          cards: 3d
          theme: aurora
          readme: README.md
          # Optional: add a PROFILESCAPE_TOKEN secret to include private contributions.
          token: ${{ secrets.PROFILESCAPE_TOKEN || github.token }}
